
<script>
(() => {
  "use strict";

  // =====================================
  // 1. CONFIGURAÇÃO DO SUPABASE
  // =====================================

  const config = window.SUPABASE_CONFIG;

  const $ = id => document.getElementById(id);

  function showMessage(id, message, type = "error") {
    const element = $(id);
    if (!element) return;

    element.textContent = message;
    element.className = "message " + type;
  }

  function clearMessage(id) {
    const element = $(id);
    if (!element) return;

    element.textContent = "";
    element.className = "message";
  }

  if (
    !config ||
    !config.url ||
    !config.key ||
    !window.supabase ||
    !window.supabase.createClient
  ) {
    showMessage(
      "loginMessage",
      "Erro na configuração do Supabase. Verifica o ficheiro config.js."
    );
    return;
  }

  const db = window.supabase.createClient(
    config.url,
    config.key
  );

  let currentUser = null;
  let currentProfile = null;
  let loadingDashboard = false;

  // =====================================
  // 2. SELEÇÃO DE GÉNERO MUSICAL
  // =====================================

  $("artistGenre").addEventListener("change", function() {
    const isOther = this.value === "Outro estilo musical";

    $("otherGenre").style.display =
      isOther ? "block" : "none";

    $("otherGenre").required = isOther;

    if (!isOther) {
      $("otherGenre").value = "";
    }
  });

  // =====================================
  // 3. CADASTRO DE ARTISTAS
  // =====================================

  $("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = $("registerButton");

    button.disabled = true;
    button.textContent = "A criar conta...";

    clearMessage("registerMessage");

    try {
      const artistName = $("artistName").value.trim();
      const fullName = $("fullName").value.trim();
      const email = $("artistEmail").value.trim();
      const phone = $("artistPhone").value.trim();
      const genre = $("artistGenre").value;
      const otherGenre = $("otherGenre").value.trim();
      const password = $("artistPassword").value;

      if (!artistName || !fullName || !email || !genre || !password) {
        throw new Error("Preenche todos os campos obrigatórios.");
      }

      if (password.length < 6) {
        throw new Error("A palavra-passe deve ter pelo menos 6 caracteres.");
      }

      if (genre === "Outro estilo musical" && !otherGenre) {
        throw new Error("Indica o teu estilo musical.");
      }

      const { data, error } = await db.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullName,
            artist_name: artistName,
            phone: phone,
            genre: genre,
            other_genre: otherGenre
          }
        }
      });

      if (error) throw error;

      if (!data.user) {
        throw new Error("Não foi possível criar a conta.");
      }

      if (data.session) {
        showMessage(
          "registerMessage",
          "Conta criada com sucesso! O teu cadastro aguarda aprovação do administrador.",
          "success"
        );

        await updateDashboard(data.user);

      } else {
        showMessage(
          "registerMessage",
          "Conta criada! Confirma o teu email antes de iniciar sessão. O cadastro ficará pendente de aprovação.",
          "success"
        );
      }

      $("registerForm").reset();
      $("otherGenre").style.display = "none";

    } catch (error) {
      showMessage(
        "registerMessage",
        error.message || "Erro ao criar conta."
      );
    } finally {
      button.disabled = false;
      button.textContent = "Criar conta gratuitamente";
    }
  });

  // =====================================
  // 4. INICIAR SESSÃO
  // =====================================

  $("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = $("loginButton");

    button.disabled = true;
    button.textContent = "A entrar...";

    clearMessage("loginMessage");

    try {
      const email = $("loginEmail").value.trim();
      const password = $("loginPassword").value;

      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      showMessage(
        "loginMessage",
        "Sessão iniciada com sucesso!",
        "success"
      );

      await updateDashboard(data.user);

    } catch (error) {
      showMessage(
        "loginMessage",
        error.message || "Não foi possível iniciar sessão."
      );
    } finally {
      button.disabled = false;
      button.textContent = "Entrar na minha conta";
    }
  });

  // =====================================
  // 5. RECUPERAÇÃO DE PALAVRA-PASSE
  // =====================================

  $("forgotPasswordButton").addEventListener("click", async function() {
    const email = $("loginEmail").value.trim();
    const button = $("forgotPasswordButton");

    clearMessage("forgotPasswordMessage");

    if (!email) {
      showMessage(
        "forgotPasswordMessage",
        "Introduz primeiro o teu email no campo de início de sessão."
      );
      return;
    }

    button.disabled = true;
    button.textContent = "A enviar...";

    try {
      const redirectUrl =
        window.location.origin + window.location.pathname;

      const { error } = await db.auth.resetPasswordForEmail(email, {
        redirectTo: redirectUrl
      });

      if (error) throw error;

      showMessage(
        "forgotPasswordMessage",
        "Se a conta existir, receberás um email com as instruções para recuperar a palavra-passe.",
        "success"
      );

    } catch (error) {
      showMessage(
        "forgotPasswordMessage",
        error.message || "Erro ao solicitar recuperação."
      );
    } finally {
      button.disabled = false;
      button.textContent = "Esqueci a minha senha";
    }
  });

  // =====================================
  // 6. CARREGAR PAINEL DO UTILIZADOR
  // =====================================

  async function updateDashboard(user) {
    if (!user || loadingDashboard) return;

    loadingDashboard = true;
    currentUser = user;

    $("userDashboard").style.display = "block";
    $("adminPanel").style.display = "none";
    $("artistPanel").style.display = "none";

    $("userInfo").textContent = "Conta: " + user.email;
    $("userRole").textContent = "A consultar o perfil...";

    try {
      const { data: profile, error } = await db
        .from("profiles")
        .select("id, full_name, artist_name, email, role, status")
        .eq("id", user.id)
        .maybeSingle();

      if (error) throw error;

      if (!profile) {
        $("userRole").textContent =
          "Perfil ainda não disponível. Contacta o administrador.";

        return;
      }

      currentProfile = profile;

      $("userInfo").textContent =
        "Bem-vindo, " + (profile.full_name || user.email);

      if (profile.role === "admin") {

        $("userRole").textContent =
          "Administrador do PORTAL DE SUCESSO.";

        $("adminPanel").style.display = "block";

      } else if (profile.role === "artist") {

        $("artistPanel").style.display = "block";

        $("artistFullName").value =
          profile.full_name || "";

        $("artistStageName").value =
          profile.artist_name || "";

        await showArtistStatus(user.id);

      } else {

        $("userRole").textContent =
          "Conta de utilizador.";

      }

      $("userDashboard").scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    } catch (error) {
      $("userRole").textContent =
        "Erro ao consultar perfil: " + error.message;
    } finally {
      loadingDashboard = false;
    }
  }

  // =====================================
  // 7. CONSULTAR ESTADO DO ARTISTA
  // =====================================

  async function showArtistStatus(userId) {
    const { data, error } = await db
      .from("artists")
      .select("status")
      .eq("user_id", userId)
      .maybeSingle();

    if (error) {
      $("userRole").textContent =
        "Não foi possível consultar o estado do cadastro: " +
        error.message;
      return;
    }

    if (!data) {
      $("userRole").textContent =
        "Cadastro de artista ainda não encontrado.";
      return;
    }

    if (data.status === "approved") {
      $("userRole").textContent = "Artista aprovado.";

    } else if (data.status === "rejected") {
      $("userRole").textContent =
        "O teu cadastro foi rejeitado. Contacta o administrador.";

    } else {
      $("userRole").textContent =
        "O teu cadastro aguarda aprovação do administrador.";
    }
  }

  // =====================================
  // 8. CARREGAR ARTISTAS - ADMIN
  // =====================================

  async function loadArtists() {
    const button = $("loadArtistsButton");

    button.disabled = true;
    button.textContent = "A carregar...";

    $("artistsList").replaceChildren();
    clearMessage("artistsMessage");

    try {
      const { data: authData, error: authError } =
        await db.auth.getUser();

      if (authError) throw authError;

      const user = authData.user;

      if (!user) {
        throw new Error("Sessão não encontrada.");
      }

      const { data: admin, error: adminError } = await db
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();

      if (adminError) throw adminError;

      if (!admin || admin.role !== "admin") {
        throw new Error("Acesso reservado ao administrador.");
      }

      // Consultar os registos de artistas
      const { data: artists, error } = await db
        .from("artists")
        .select("id, user_id, artist_name, status")
        .order("artist_name", { ascending: true });

      if (error) throw error;

      if (!artists || artists.length === 0) {
        showMessage(
          "artistsMessage",
          "Ainda não existem artistas cadastrados.",
          "success"
        );
        return;
      }

      // Consultar os perfis correspondentes
      const userIds = [
        ...new Set(artists.map(artist => artist.user_id))
      ];

      const { data: profiles, error: profileError } = await db
        .from("profiles")
        .select("id, full_name, email, phone, genre, other_genre")
        .in("id", userIds);

      if (profileError) throw profileError;

      const profileMap = new Map(
        (profiles || []).map(profile => [profile.id, profile])
      );

      artists.forEach(artist => {
        const profile = profileMap.get(artist.user_id) || {};

        const card = document.createElement("div");
        card.className = "artist-item";

        const name = document.createElement("h3");
        name.textContent =
          artist.artist_name || "Artista sem nome";

        const fullName = document.createElement("p");
        fullName.textContent =
          "Nome completo: " + (profile.full_name || "Não informado");

        const email = document.createElement("p");
        email.textContent =
          "Email: " + (profile.email || "Não informado");

        const phone = document.createElement("p");
        phone.textContent =
          "Telefone: " + (profile.phone || "Não informado");

        const genre = document.createElement("p");
        genre.textContent =
          "Género: " +
          (profile.genre === "Outro estilo musical"
            ? profile.other_genre || profile.genre
            : profile.genre || "Não informado");

        const status = document.createElement("p");
        status.textContent =
          "Estado: " + (artist.status || "pending");

        status.className =
          artist.status === "approved"
            ? "status-approved"
            : artist.status === "rejected"
              ? "status-rejected"
              : "status-pending";

        card.append(
          name,
          fullName,
          email,
          phone,
          genre,
          status
        );

        if (artist.status !== "approved") {
          const approveButton = document.createElement("button");
          approveButton.type = "button";
          approveButton.className = "btn";
          approveButton.textContent = "Aprovar";

          approveButton.addEventListener("click", () => {
            changeArtistStatus(artist.id, "approved");
          });

          card.appendChild(approveButton);
        }

        if (artist.status !== "rejected") {
          const rejectButton = document.createElement("button");
          rejectButton.type = "button";
          rejectButton.className = "btn btn-outline";
          rejectButton.textContent = "Rejeitar";

          rejectButton.addEventListener("click", () => {
            changeArtistStatus(artist.id, "rejected");
          });

          card.appendChild(rejectButton);
        }

        $("artistsList").appendChild(card);
      });

      showMessage(
        "artistsMessage",
        "Foram encontrados " + artists.length + " registos de artistas.",
        "success"
      );

    } catch (error) {
      showMessage(
        "artistsMessage",
        "Erro ao carregar artistas: " + error.message
      );
    } finally {
      button.disabled = false;
      button.textContent = "Ver artistas";
    }
  }

  // =====================================
  // 9. APROVAR OU REJEITAR ARTISTAS
  // =====================================

  async function changeArtistStatus(artistId, newStatus) {
    const action =
      newStatus === "approved" ? "aprovar" : "rejeitar";

    if (!window.confirm(
      "Tens a certeza de que pretendes " + action + " este artista?"
    )) {
      return;
    }

    try {
      const { data: authData, error: authError } =
        await db.auth.getUser();

      if (authError) throw authError;

      if (!authData.user) {
        throw new Error("Sessão não encontrada.");
      }

      const { data: admin, error: adminError } = await db
        .from("profiles")
        .select("role")
        .eq("id", authData.user.id)
        .maybeSingle();

      if (adminError) throw adminError;

      if (!admin || admin.role !== "admin") {
        throw new Error("Não tens autorização para esta operação.");
      }

      const { data, error } = await db.rpc(
        "admin_set_artist_status",
        {
          p_artist_id: artistId,
          p_status: newStatus
        }
      );

      if (error) throw error;

      if (data !== true) {
        throw new Error(
          "A operação não confirmou a atualização do artista."
        );
      }

      showMessage(
        "artistsMessage",
        newStatus === "approved"
          ? "Artista aprovado com sucesso!"
          : "Cadastro do artista rejeitado.",
        "success"
      );

      await loadArtists();

    } catch (error) {
      showMessage(
        "artistsMessage",
        "Erro ao atualizar artista: " + error.message
      );
    }
  }

  // Ativar botão de consulta de artistas
  $("loadArtistsButton").addEventListener("click", loadArtists);

  // =====================================
  // 10. ATUALIZAR PERFIL DO ARTISTA
  // =====================================

  $("artistProfileForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = $("saveArtistProfile");

    button.disabled = true;
    button.textContent = "A guardar...";

    clearMessage("artistProfileMessage");

    try {
      const { data: authData, error: authError } =
        await db.auth.getUser();

      if (authError) throw authError;

      const user = authData.user;

      if (!user) {
        throw new Error("Sessão não encontrada. Entra novamente.");
      }

      const { data: profile, error: profileError } = await db
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();

      if (profileError) throw profileError;

      if (!profile || profile.role !== "artist") {
        throw new Error("Esta operação é exclusiva para artistas.");
      }

      const fullName = $("artistFullName").value.trim();
      const artistName = $("artistStageName").value.trim();

      if (!fullName || !artistName) {
        throw new Error("Preenche os dois campos.");
      }

      const { error } = await db
        .from("profiles")
        .update({
          full_name: fullName,
          artist_name: artistName
        })
        .eq("id", user.id);

      if (error) throw error;

      showMessage(
        "artistProfileMessage",
        "Dados atualizados com sucesso!",
        "success"
      );

      await updateDashboard(user);

    } catch (error) {
      showMessage(
        "artistProfileMessage",
        "Erro: " + error.message
      );
    } finally {
      button.disabled = false;
      button.textContent = "Guardar alterações";
    }
  });

  // =====================================
  // 11. TERMINAR SESSÃO
  // =====================================

  $("logoutButton").addEventListener("click", async function() {
    const button = $("logoutButton");

    button.disabled = true;

    try {
      const { error } = await db.auth.signOut();

      if (error) throw error;

      currentUser = null;
      currentProfile = null;

      $("userDashboard").style.display = "none";
      $("adminPanel").style.display = "none";
      $("artistPanel").style.display = "none";

      $("loginForm").reset();

      showMessage(
        "loginMessage",
        "Sessão terminada com sucesso.",
        "success"
      );

    } catch (error) {
      showMessage(
        "loginMessage",
        "Erro ao terminar sessão: " + error.message
      );
    } finally {
      button.disabled = false;
    }
  });

  // =====================================
  // 12. DETETAR ALTERAÇÕES DE SESSÃO
  // =====================================

  db.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_IN" && session) {
      setTimeout(() => {
        updateDashboard(session.user);
      }, 0);
    }

    if (event === "SIGNED_OUT") {
      currentUser = null;
      currentProfile = null;

      $("userDashboard").style.display = "none";
      $("adminPanel").style.display = "none";
      $("artistPanel").style.display = "none";
    }

    if (event === "PASSWORD_RECOVERY") {
      showMessage(
        "loginMessage",
        "Introduz a tua nova palavra-passe através da opção de recuperação.",
        "success"
      );
    }
  });

  // =====================================
  // 13. RESTAURAR SESSÃO EXISTENTE
  // =====================================

  async function initializeApp() {
    try {
      const { data, error } = await db.auth.getSession();

      if (error) throw error;

      if (data.session && data.session.user) {
        await updateDashboard(data.session.user);
      }

    } catch (error) {
      console.error(
        "Erro ao restaurar sessão:",
        error.message
      );
    }
  }

  initializeApp();

})();
</script>

</body>
</html>
